name: Update Changelog

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0  # ensure full history so changelog isn't truncated
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install changelog generator
        run: npm install -g conventional-changelog-cli
      - name: Generate CHANGELOG
        # Manual-only: the generator prepends anonymous releases when no tag is
        # available, so keep the curated changelog out of the push path.
        run: conventional-changelog -p angular -i CHANGELOG.md -s -r 1
      - name: Commit changes
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changelog updates"
          else
            git commit -m "chore(changelog): 🤖 update changelog" && git push
          fi
